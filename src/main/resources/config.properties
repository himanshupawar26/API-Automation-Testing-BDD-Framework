# Default environment configuration (committed; contains no secrets).
# Override any value via -D system property, e.g.:
#   mvn test -Dbase.url=https://reqres.in/api
# or via environment variable (see Config.java for the exact var name per key).

base.url=https://reqres.in/api
request.timeout.seconds=10

# api.key is intentionally left unset here. Anonymous requests are capped at
# 40/day per IP by ReqRes. Set it in a git-ignored src/main/resources/config.local.properties
# (see config.local.properties.example) or via the RQRES_API_KEY environment
# variable / repository secret in CI.

