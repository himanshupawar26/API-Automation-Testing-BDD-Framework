# Registers Allure's Cucumber7 plugin and Cucumber's own HTML/JSON/pretty
# reporters with the JUnit Platform Cucumber engine. This is the documented
# registration mechanism for allure-cucumber7-jvm under the JUnit Platform
# Suite engine (as opposed to the legacy JUnit4 @CucumberOptions runner).
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm, pretty, summary, \
  html:target/cucumber-report/cucumber.html, json:target/cucumber-report/cucumber.json
cucumber.glue=com.himanshupawar.api
